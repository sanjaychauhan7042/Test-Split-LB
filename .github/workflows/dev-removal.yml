name: Dev Deployment Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (Add, Modify, Remove)'
        required: true
        default: 'Add'
        options:
          - Add
          - Modify
          - Remove
      environment:
        description: 'Environment (Dev, Prod, UAT)'
        required: true
        type: choice
        options:
          - Dev
          - Prod
          - UAT

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: dev  # This links to the "dev" environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Environment
        run: echo "Preparing for deployment to ${{ github.event.inputs.environment }} environment"

      - name: Add Resource
        if: ${{ github.event.inputs.action == 'Add' }}
        run: echo "Adding resource to ${{ github.event.inputs.environment }} environment"

      - name: Modify Resource
        if: ${{ github.event.inputs.action == 'Modify' }}
        run: echo "Modifying resource in ${{ github.event.inputs.environment }} environment"

      - name: Remove Resource
        if: ${{ github.event.inputs.action == 'Remove' }}
        run: |
          echo "Requesting approval for resource removal..."
          exit 1  # Ensure the workflow exits and waits for approval

  dev-remove:
    runs-on: ubuntu-latest

    if: ${{ github.event.inputs.environment == 'Dev' && github.event.inputs.action == 'Remove' }}

    environment:
      name: Dev
      url: https://your-dev-environment-url.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Remove Resources
        run: echo "Removing resources from Dev"
